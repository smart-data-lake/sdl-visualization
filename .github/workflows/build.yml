name: Build

on: 
  push:
    branches:
      - 'master'
      - 'develop'
  pull_request:
    branches:
      - 'develop'
    types: [opened, synchronize]      

  # allow for manual builds from feature branches
  workflow_dispatch:

# Two builds and a release. The frontend and the backend are separate packages that
# ship to separate Azure resources, so they build in separate jobs: the backend
# artifact is then not gated on the frontend's end-to-end run, and both are available
# as `sdl-visualizer.zip` and `sdl-visualizer-backend.zip` - from the newest release,
# or through nightly.link for the newest develop run. backend/infra_azure/artifact.sh
# holds those two URLs, and the deploy scripts download them when there is no local
# build; the artifact names below are what makes them resolve.
jobs:
  build-frontend:

    runs-on: ubuntu-latest

    steps:

    - name: Git Checkout
      uses: actions/checkout@v7

    - name: Setup node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: yarn

    - run: yarn install

    # The backend is a separate package. It is installed here because the azure
    # end-to-end project starts it (with its own Azurite and the fixtures seeded).
    - name: Install backend
      run: yarn --cwd backend install --frozen-lockfile

    - run: yarn build
      env:
        CI: '' # disable CI mode as it makes build fail on warnings

    - name: Lint
      run: yarn lint

    - name: Type check
      run: yarn type-check

    - name: Run unit tests
      run: yarn test:ci

    - name: Type check backend
      run: yarn --cwd backend type-check

    - name: Run backend tests
      run: yarn --cwd backend test:ci

    - name: Get playwright version
      id: playwright-version
      run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> $GITHUB_OUTPUT

    - name: Cache playwright browsers
      uses: actions/cache@v6
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    - name: Install playwright chromium
      run: npx playwright install --with-deps chromium

    - name: Run end-to-end tests
      run: yarn test:e2e

    - name: Upload playwright report
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

    - name: Add additional files to build
      run: cp build_index.* requirements.txt build 

    - name: Upload build to artifact
      uses: actions/upload-artifact@v7
      with:
        name: sdl-visualizer
        path: |
          build/assets/*
          build/images/*
          build/*
          !build/config
          !build/envConfig
          !build/description
          !build/schema

  # What the Function app is fed. `yarn package` (backend/scripts/package.ts) decides
  # what is in it, and infra_azure/deploy-backend.sh uploads what that produces - so
  # the package CI publishes and the package a developer uploads are the same layout
  # without this job knowing anything about the deployment. The artifact holds the
  # contents of the package rather than a zip of it, which is what makes the downloaded
  # sdl-visualizer-backend.zip deployable as it comes.
  build-backend:

    runs-on: ubuntu-latest

    steps:

    - name: Git Checkout
      uses: actions/checkout@v7

    - name: Setup node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: yarn
        cache-dependency-path: backend/yarn.lock

    - name: Install backend
      run: yarn --cwd backend install --frozen-lockfile

    # esbuild, via backend/scripts/bundle.ts. dist/ is the whole artefact; see "What
    # gets deployed, and cold start" in backend/README.md.
    - name: Build backend
      run: yarn --cwd backend build

    # Stages host.json, package.json and dist/, adds the production-only install
    # (@azure/functions and nothing else) and checks the result is deployable.
    # --no-build so a failing bundle fails the step above rather than this one.
    - name: Package backend
      run: yarn --cwd backend package --no-build --out "$RUNNER_TEMP/backend-package"

    - name: Upload backend to artifact
      uses: actions/upload-artifact@v7
      with:
        name: sdl-visualizer-backend
        path: ${{ runner.temp }}/backend-package

  # Only master, and only once both packages exist: a release carrying one of the two
  # is worse than no release.
  release:

    needs: [build-frontend, build-backend]
    if: ${{ github.ref_name == 'master' }}

    runs-on: ubuntu-latest

    steps:

    - name: Git Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.PAT_ACTIONS }}

    - name: Get-npm-version
      id: package-version
      uses: martinbeentjes/npm-get-version-action@main

    - name: Bump version on develop
      uses:  phips28/gh-action-bump-version@v11.0.7
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_ACTIONS }}
      with:
        target-branch: develop
        skip-tag: true
        check-last-commit-only: true

    - name: Download frontend artifact
      uses: actions/download-artifact@v8
      with:
        path: artifact
        name: sdl-visualizer

    - name: Zip frontend release asset
      uses: thedoctor0/zip-release@main
      with:
        type: zip
        directory: artifact
        filename: sdl-visualizer.zip

    - name: Download backend artifact
      uses: actions/download-artifact@v8
      with:
        path: backend-artifact
        name: sdl-visualizer-backend

    - name: Zip backend release asset
      uses: thedoctor0/zip-release@main
      with:
        type: zip
        directory: backend-artifact
        filename: sdl-visualizer-backend.zip

    - name: Create release
      uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        title: Release-${{ steps.package-version.outputs.current-version}}
        automatic_release_tag: ${{ steps.package-version.outputs.current-version}}
        draft: true
        prerelease: false
        files: |
          artifact/sdl-visualizer.zip
          backend-artifact/sdl-visualizer-backend.zip
