# Foreign keys for the Entity Relation Diagram.
#
# This file is NOT part of the getting-started project - it is a fixture overlay, added here
# because nothing upstream declares a `foreignKeys` block and the relations view would have no
# data to show. update-fixtures.sh only overwrites the four files it downloads, so this one
# survives a refresh; the same keys are patched into exported/exportedConfig.json there.
#
# HOCON merges objects, so each block below adds to the `table` its data object already has.

dataObjects {

  int-departures {
    table {
      foreignKeys = [
        # two foreign keys between the same pair of data objects: the two ends of a flight
        { name = "fk_departure_airport", dataObjectId = "int-airports", columns = { estdepartureairport = "ident" } }
        { name = "fk_arrival_airport",   dataObjectId = "int-airports", columns = { estarrivalairport = "ident" } }
        # the pre 3.x form, which names a table instead of a data object: ignored, so neither the
        # relations graph nor the column list of int-departures knows anything about legacy_column
        { name = "fk_legacy", db = "reference", table = "airlines", columns = { legacy_column = "callsign" } }
      ]
    }
  }

  btl-departures-arrivals-airports {
    table {
      foreignKeys = [
        { name = "fk_arrival_airport", dataObjectId = "int-airports", columns = { estarrivalairport = "ident" } }
        # points outside this configuration - rendered as an unresolved reference
        { name = "fk_airline", dataObjectId = "int-airlines", columns = { callsign = "callsign" } }
      ]
    }
  }
}
